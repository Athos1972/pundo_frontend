# Pitch video "Why pundo?" (EN + EL), the WHY before the tutorial series. Approved German draft: 01-skript.de.md
# (BB 2026-10-14: approved, hook with a Russian search). Only verifiable claims (see the table in the script).
# Customer side of pundo on the phone; demo shop of the video language (prepare_pitch.py: fresh bread 2.50,
# sourdough promo 3.90, opening hours, languages). The hook is always the Russian search "хлеб".
# The last scene shows the first sign-up step (NOT the for-shops page: it currently shows placeholder numbers).

meta:
  slug: pitch
  title:
    en: "Why pundo? Get found by customers nearby"
    el: "Γιατί pundo; Να σε βρίσκουν οι πελάτες κοντά σου"
    ru: "Почему pundo? Пусть клиенты рядом находят вас"
  url:
    en: "pundo.cy/for-shops"
    el: "pundo.cy/for-shops"
    ru: "pundo.cy/ru/for-shops"
  next_video:
    en: "Next: sign up in 5 minutes"
    el: "Επόμενο: εγγραφή σε 5 λεπτά"
    ru: "Далее: регистрация за 5 минут"
  demo:
    search: "хлеб"
  thumbnail_scene: languages
  target_duration_s: 70

scenes:
  - id: intro
    branding: intro

  - id: hook
    shot: 'pundo in Russian: search "хлеб" -> map + result "Свежий хлеб" at Anna''s Bakery'
    callout:
      en: "Customers search. Are you there?"
      el: "Οι πελάτες ψάχνουν. Είσαι εκεί;"
      ru: "Клиенты ищут. А вы там есть?"
    narration:
      en: >-
        Someone in Limassol is searching right now for exactly what you offer. Will they find you?
      el: >-
        Κάποιος στη Λεμεσό ψάχνει αυτή τη στιγμή ακριβώς αυτό που προσφέρεις. Θα σε βρει;
      ru: >-
        Кто-то в Лимассоле прямо сейчас ищет именно то, что вы предлагаете. Найдёт ли он вас?

  - id: problem
    shot: 'result card + map pin of Anna''s Bakery highlighted'
    callout:
      en: "Get found nearby"
      el: "Να σε βρίσκουν κοντά σου"
      ru: "Пусть вас находят рядом"
    narration:
      en: >-
        People from all over the world live and holiday in Cyprus. Many search in their own language,
        and go where they understand what's on offer and what it costs.
      el: >-
        Στην Κύπρο ζουν και κάνουν διακοπές άνθρωποι από όλο τον κόσμο. Πολλοί ψάχνουν στη δική τους γλώσσα
        και πηγαίνουν εκεί όπου καταλαβαίνουν τι υπάρχει και πόσο κοστίζει.
      ru: >-
        На Кипре живут и отдыхают люди со всего мира. Многие ищут на своём языке и идут туда, где понятно,
        что есть в наличии и сколько это стоит.

  - id: languages
    shot: 'Anna''s shop page in English -> Greek -> Russian, product names change'
    callout:
      en: "In 6 languages, automatically"
      el: "Σε 6 γλώσσες, αυτόματα"
      ru: "На 6 языках, автоматически"
    narration:
      en: >-
        With pundo, you add your products and services once. pundo shows them in six languages:
        Greek, English, Russian, German, Arabic and Hebrew.
      el: >-
        Με το pundo προσθέτεις τα προϊόντα και τις υπηρεσίες σου μία φορά. Το pundo τα δείχνει σε έξι γλώσσες:
        ελληνικά, αγγλικά, ρωσικά, γερμανικά, αραβικά και εβραϊκά.
      ru: >-
        С pundo вы добавляете товары и услуги один раз. pundo показывает их на шести языках: греческом,
        английском, русском, немецком, арабском и иврите.

  - id: prices
    shot: 'shop page: promo card (3.90 instead of 4.50), opening hours with lunch break'
    callout:
      en: "Prices, offers, opening hours"
      el: "Τιμές, προσφορές, ώρες"
      ru: "Цены, акции, часы работы"
    narration:
      en: >-
        Customers instantly see your prices, your offers and whether you're open right now.
        You don't need your own website for that.
      el: >-
        Οι πελάτες βλέπουν αμέσως τις τιμές σου, τις προσφορές σου και αν είσαι ανοιχτά αυτή τη στιγμή.
        Δεν χρειάζεσαι δική σου ιστοσελίδα γι' αυτό.
      ru: >-
        Клиенты сразу видят ваши цены, акции и открыты ли вы прямо сейчас. Собственный сайт для этого не
        нужен.

  - id: contact
    shot: 'shop page: WhatsApp / phone highlighted (not tapped)'
    callout:
      en: "Customers contact you directly"
      el: "Οι πελάτες σε βρίσκουν απευθείας"
      ru: "Клиенты пишут вам напрямую"
    narration:
      en: >-
        Interested customers contact you directly, by WhatsApp or phone. pundo takes no commission.
      el: >-
        Όποιος ενδιαφέρεται επικοινωνεί απευθείας μαζί σου, με WhatsApp ή τηλέφωνο. Το pundo δεν παίρνει προμήθεια.
      ru: >-
        Заинтересованные клиенты связываются с вами напрямую, через WhatsApp или по телефону. pundo не берёт
        комиссию.

  - id: free
    shot: 'first sign-up step (business type)'
    callout:
      en: "Free · 5 minutes"
      el: "Δωρεάν · 5 λεπτά"
      ru: "Бесплатно · 5 минут"
    narration:
      en: >-
        Your listing is free and done in five minutes. We show you how, step by step, in our series.
      el: >-
        Η καταχώριση είναι δωρεάν και γίνεται σε πέντε λεπτά. Σου δείχνουμε πώς, βήμα βήμα, στη σειρά μας.
      ru: >-
        Регистрация бесплатна и занимает пять минут. Как это сделать, мы пошагово показываем в нашей серии
        видео.

  - id: wrap-up
    shot: 'sign-up step stays'
    callout:
      en: "pundo.cy/for-shops"
      el: "pundo.cy/for-shops"
      ru: "pundo.cy/ru/for-shops"
    narration:
      en: >-
        pundo: so customers nearby can find you.
      el: >-
        pundo: για να σε βρίσκουν οι πελάτες κοντά σου.
      ru: >-
        pundo: чтобы клиенты рядом находили вас.

  - id: outro
    branding: outro
