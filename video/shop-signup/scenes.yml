# Single source of truth for the shop-signup video (EN + EL).
# Approved German draft: 01-skript.de.md (review only, not produced).
# Pipeline reads: id, shot (what the recorder does), callout (side text overlay), narration.
# UI terms in quotes match the live UI strings (src/lib/i18n/shop-admin-auth.ts, src/lib/for-shops-content.ts).

meta:
  slug: shop-signup
  title:
    en: "Sign up your shop in 5 minutes or less"
    el: "Καταχώρισε το κατάστημά σου σε λιγότερο από 5 λεπτά"
  url:
    en: "pundo.cy/en/for-shops"
    el: "pundo.cy/el/for-shops"
  next_video:
    en: "Next video: Add your products, services & prices"
    el: "Στο επόμενο βίντεο: Πρόσθεσε προϊόντα, υπηρεσίες & τιμές"
  demo_shop:
    name: { en: "Anna's Bakery", el: "Ο Φούρνος της Άννας" }
    city: Limassol
    provider_type: haendler
  target_duration_s: 180

scenes:
  - id: intro
    branding: intro          # reusable block from video/_branding, no narration

  - id: welcome
    shot: customer homepage (/{lang}), slow zoom
    callout:
      en: "Free for your business"
      el: "Δωρεάν για την επιχείρησή σου"
    narration:
      en: >-
        Hi, and welcome to pundo! pundo shows people in Cyprus where to find exactly
        what they're looking for, close by: products, services and prices.
        In this video, we'll walk you through signing up your business, step by step.
        It takes less than five minutes, and it's completely free.
      el: >-
        Γεια σου και καλώς ήρθες στο pundo! Το pundo δείχνει στους ανθρώπους στην Κύπρο
        πού θα βρουν κοντά τους ακριβώς αυτό που ψάχνουν: προϊόντα, υπηρεσίες και τιμές.
        Σε αυτό το βίντεο σου δείχνουμε, βήμα βήμα, πώς να καταχωρίσεις την επιχείρησή σου.
        Χρειάζεται λιγότερο από πέντε λεπτά, και είναι εντελώς δωρεάν.

  - id: entry
    shot: /{lang}/for-shops, scroll to hero CTA, tap "Register free"
    callout:
      en: "pundo.cy/en/for-shops"
      el: "pundo.cy/el/for-shops"
    narration:
      en: >-
        Open pundo on your phone or computer and go to the page for shops.
        Tap "Register free". At the top, you'll always see which of the six steps you're on.
      el: >-
        Άνοιξε το pundo στο κινητό ή στον υπολογιστή σου και πήγαινε στη σελίδα για καταστήματα.
        Πάτησε «Δωρεάν εγγραφή». Πάνω πάνω βλέπεις πάντα σε ποιο από τα έξι βήματα βρίσκεσαι.

  - id: step1-type
    shot: onboarding step 1, select "Retailer"/"Έμπορος", Next
    callout:
      en: "Step 1 · Type of business"
      el: "Βήμα 1 · Είδος επιχείρησης"
    narration:
      en: >-
        First, choose what kind of business you run: are you a retailer, a service provider,
        a tradesperson, or do you run a restaurant or bar? Anna sells bread and pastries,
        so she picks "Retailer".
      el: >-
        Πρώτα διαλέγεις τι είδους επιχείρηση έχεις: είσαι έμπορος, πάροχος υπηρεσιών,
        τεχνίτης ή έχεις εστιατόριο ή μπαρ; Η Άννα πουλάει ψωμί και αρτοσκευάσματα,
        οπότε διαλέγει «Έμπορος».

  - id: step2-offer
    shot: onboarding step 2, tap one or two domains, then optional specialties, Next
    callout:
      en: "Step 2 · What you offer"
      el: "Βήμα 2 · Τι προσφέρεις"
    narration:
      en: >-
        Next, select the areas you're active in. At least one is needed.
        If you like, you can also add specialties. That's optional,
        but it helps customers find you faster.
      el: >-
        Στη συνέχεια επιλέγεις τους τομείς στους οποίους δραστηριοποιείσαι, τουλάχιστον έναν.
        Αν θέλεις, μπορείς να προσθέσεις και ειδικότητες. Είναι προαιρετικό,
        αλλά βοηθά τους πελάτες να σε βρουν πιο γρήγορα.

  - id: step3-location
    shot: onboarding step 3, type address in Limassol, pin appears, tick customer-facing shop, Next
    callout:
      en: "Step 3 · Location"
      el: "Βήμα 3 · Τοποθεσία"
    narration:
      en: >-
        Now it's about your location. Simply type in your address, or tap right on the map.
        If you have a shop that customers can visit, tick the box.
        If you work on the go or without a shop, just leave it unticked.
      el: >-
        Τώρα σειρά έχει η τοποθεσία σου. Απλώς γράψε τη διεύθυνσή σου ή πάτησε κατευθείαν πάνω στον χάρτη.
        Αν έχεις κατάστημα που μπορούν να επισκεφθούν οι πελάτες, τσέκαρε το κουτάκι.
        Αν δουλεύεις χωρίς κατάστημα ή πηγαίνεις εσύ στους πελάτες, απλώς άφησέ το κενό.

  - id: step4-contact
    shot: onboarding step 4, fill WhatsApp + phone, other channels visible, Next
    callout:
      en: "Step 4 · Contact"
      el: "Βήμα 4 · Επικοινωνία"
    narration:
      en: >-
        How should customers reach you? WhatsApp, phone, email, Instagram, Facebook,
        Telegram or your website. You need at least one channel.
        In Cyprus, WhatsApp is usually the best choice.
      el: >-
        Πώς θέλεις να επικοινωνούν μαζί σου οι πελάτες; WhatsApp, τηλέφωνο, email, Instagram,
        Facebook, Telegram ή η ιστοσελίδα σου. Χρειάζεται τουλάχιστον ένα κανάλι.
        Στην Κύπρο, το WhatsApp είναι συνήθως η καλύτερη επιλογή.

  - id: step5-name-photo
    shot: onboarding step 5, type shop name, choose cover photo, preview, Next
    callout:
      en: "Step 5 · Name & photo"
      el: "Βήμα 5 · Όνομα & φωτογραφία"
    narration:
      en: >-
        Enter your business name, just the way your customers know it.
        A nice cover photo makes your listing feel personal right away.
        Your shop window or your counter work great. You can change the photo any time.
      el: >-
        Γράψε το όνομα της επιχείρησής σου, έτσι όπως το ξέρουν οι πελάτες σου.
        Μια ωραία φωτογραφία εξωφύλλου κάνει την καταχώρισή σου αμέσως πιο προσωπική.
        Η βιτρίνα ή ο πάγκος σου είναι ιδανικά. Μπορείς να αλλάξεις τη φωτογραφία όποτε θέλεις.

  - id: step6-credentials
    shot: onboarding step 6, highlight "Continue with Google", then fill email + masked password, tap "Complete registration"
    callout:
      en: "Step 6 · Login details"
      el: "Βήμα 6 · Στοιχεία σύνδεσης"
    narration:
      en: >-
        Almost done! Now decide how you'll log in later. The easiest way is your Google account:
        one tap, and you're done. Or enter your email address and a secure password,
        and tap "Complete registration".
      el: >-
        Σχεδόν τελείωσες! Τώρα αποφασίζεις πώς θα συνδέεσαι στο εξής. Ο πιο εύκολος τρόπος
        είναι ο λογαριασμός σου στο Google: ένα πάτημα και τελείωσες. Ή γράψε το email σου
        και έναν ασφαλή κωδικό και πάτησε «Ολοκλήρωση εγγραφής».

  - id: confirm
    shot: /shop-admin/register/check-email
    callout:
      en: "Click the link in your email"
      el: "Πάτησε τον σύνδεσμο στο email σου"
    narration:
      en: >-
        We'll now send you an email. Click the link inside to confirm your account.
        By the way: if you get interrupted along the way, pundo remembers what you've entered,
        so you can simply pick up where you left off.
      el: >-
        Τώρα σου στέλνουμε ένα email. Πάτησε τον σύνδεσμο που περιέχει για να επιβεβαιώσεις
        τον λογαριασμό σου. Και κάτι ακόμα: αν σε διακόψουν στη μέση, το pundo θυμάται
        όσα έχεις ήδη συμπληρώσει, και μπορείς απλώς να συνεχίσεις από εκεί που σταμάτησες.

  - id: outlook
    shot: check-email page fades, "next video" card
    callout:
      en: "Next: products, services & prices"
      el: "Επόμενο: προϊόντα, υπηρεσίες & τιμές"
    narration:
      en: >-
        Congratulations, your business is now signed up on pundo!
        In the next video, we'll show you how to add your products and services,
        set your prices, and much more. See you there!
      el: >-
        Συγχαρητήρια, η επιχείρησή σου είναι πλέον καταχωρισμένη στο pundo!
        Στο επόμενο βίντεο θα σου δείξουμε πώς να προσθέσεις τα προϊόντα και τις υπηρεσίες σου,
        να ορίσεις τις τιμές σου και πολλά άλλα. Τα λέμε εκεί!

  - id: outro
    branding: outro          # reusable block, includes YouTube end-screen area
