scenes:
  - id: intro
    branding: intro

  - id: pick
    shot: 'offer picker (opened in prep): type the full name, result with photo, tap it'
    callout:
      en: "Already on pundo"
      el: "Υπάρχει ήδη στο pundo"
    narration:
      en: >-
        Catering is already on pundo, with a photo. Search for it and tap it once.
      el: >-
        Το catering υπάρχει ήδη στο pundo, με φωτογραφία. Ψάξ' το και πάτησέ το μία φορά.

  - id: price
    shot: 'price type "On request", Save'
    callout:
      en: "Price: on request"
      el: "Τιμή: κατόπιν αιτήματος"
    narration:
      en: >-
        The price depends on the event? Choose "On request" and save.
      el: >-
        Η τιμή εξαρτάται από την εκδήλωση; Διάλεξε «Κατόπιν αιτήματος» και αποθήκευσε.

  - id: done
    shot: 'customer shop page: catering card "Price on request", then WhatsApp / phone'
    callout:
      en: "Customers contact you"
      el: "Οι πελάτες σε βρίσκουν"
    narration:
      en: >-
        Customers see "On request" and contact you directly, by WhatsApp or phone.
      el: >-
        Οι πελάτες βλέπουν «Κατόπιν αιτήματος» και επικοινωνούν απευθείας μαζί σου, με WhatsApp ή τηλέφωνο.

  - id: outro
