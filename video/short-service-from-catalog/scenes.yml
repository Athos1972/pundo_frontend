  format: vertical
  title:
    en: "Price on request? Customers contact you directly"
    el: "Τιμή κατόπιν αιτήματος; Οι πελάτες σε βρίσκουν απευθείας"
  url:
    en: "pundo.cy/shop-admin"
    el: "pundo.cy/shop-admin"
  next_video:
    en: "Full tutorial ↓"
    el: "Ολόκληρος ο οδηγός ↓"
  demo:
    search: { en: "Catering / events", el: "Catering / εκδηλώσεις" }
    name: { en: "Catering / events", el: "Catering / εκδηλώσεις" }
