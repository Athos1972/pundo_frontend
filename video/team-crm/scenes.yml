# Team video 5 "CRM: organisations and outreach" (F8960 Team-SOPs & Admin-Hilfe, topic 5; re-recorded after the F7600 CRM-Backbone
# org cut). Internal: channel "pundo Team", unlisted. EN voice (narration.en) + burnt-in EN subtitles; EL = subtitles only
# (subtitle.el -> out/team-crm.el.srt). DRAFT (EN script awaits approval by Bernhard, EL awaits a native-speaker read: F8960 O3).
# Order and wording follow the SOP "crm" in src/lib/system-admin-help-content.ts (rules box, sections). People and relations: video 5b.
# Recording: ONLY test instance 3500/8500 (strict mode), admin login via API (no login scene), demo data from
# ../team-common/prepare_team.py (marker "Team Demo"). The video CREATES the organisation "Team Demo Cafe" (prepare_team.py deletes it
# on the next run), clicks "Confirm business" on "Team Demo Bakery" (NEEDS_REVIEW -> QUEUED), loads a preview and APPROVES one send to
# the red relation e-mail of Petros (prepare_team.py puts everything back). NOTHING is sent (the recorder rejects every request to
# outreach/send), NOTHING is suppressed (dialog cancelled), the safety settings are only looked at. Lists of the CRM hold real
# organisations and people of the test copy: every row/entry without "Team Demo" is blurred (armMask).
# Address bar: every scene shows exactly one page (window_path is static per scene); page switches happen at the scene borders or
# while the picture is frozen. The ids in window_path (org 7413) are checked by record.mjs against prepare_team.py.
# UI terms in quotes match src/lib/system-admin-translations.ts (EN in "...", EL in «...»).

meta:
  slug: team-crm
  format: desktop
  voice_langs: [en]
  subtitle_langs: [el]
  title:
    en: "CRM: organisations and outreach"
    el: "CRM: οργανισμοί και προσέγγιση"
  url:
    en: "pundo team · admin help"
    el: "pundo team · βοήθεια admin"
  next_video:
    en: "Next: CRM people and relations"
    el: "Επόμενο: CRM, πρόσωπα και σχέσεις"
  thumbnail_scene: outreach
  target_duration_s: 260
  window_path:
    en: "localhost:3500/admin/crm/orgs"
    el: "localhost:3500/admin/crm/orgs"

scenes:
  - id: intro
    branding: intro

  - id: list
    shot: 'organisation list (non-demo rows blurred): pointer over the table and the lead status chips, click "Only acquisition targets"'
    chapter: { en: "Organisations and lead status" }
    window_path: { en: "localhost:3500/admin/crm/orgs" }
    callout: { en: "Admin · CRM" }
    narration:
      en: >-
        Welcome back.
        The CRM holds organisations, such as shops and offices, the people who work there, and every message we send.
        Each row is one organisation with its lead status.
        The chips filter by lead status, and "Only acquisition targets" hides organisations that we do not want to win as customers.
        Real rows are blurred here.
    subtitle:
      el:
        - "Καλωσορίσατε ξανά."
        - "Το CRM περιέχει οργανισμούς, όπως καταστήματα και γραφεία, τους ανθρώπους που εργάζονται εκεί και κάθε μήνυμα που στέλνουμε."
        - "Κάθε γραμμή είναι ένας οργανισμός με την «Κατάσταση lead» του."
        - "Τα chips φιλτράρουν ανά κατάσταση lead και το «Μόνο στόχοι προσέγγισης» κρύβει τους οργανισμούς που δεν θέλουμε να αποκτήσουμε ως πελάτες."
        - "Οι πραγματικές γραμμές είναι εδώ θολές."

  - id: search
    shot: 'type "Team Demo" into the search, Enter -> head office ("Needs review"), branch ("Branch of ..."), employer ("No acquisition target"); pointer on "+ Add organisation"'
    chapter: { en: "Search first" }
    window_path: { en: "localhost:3500/admin/crm/orgs" }
    callout: { en: "CRM · Search" }
    narration:
      en: >-
        Always search first: type at least two characters of the name, or an exact email address or phone number, and press Enter.
        Our demo chain appears: the head office needs review, its branch in Larnaca names the head office, and the accounting office has no acquisition target.
        Only if nothing matches, click "Add organisation".
    subtitle:
      el:
        - "Αναζητήστε πάντα πρώτα: πληκτρολογήστε τουλάχιστον δύο χαρακτήρες του ονόματος ή ένα ακριβές email ή τηλέφωνο και πατήστε Enter."
        - "Εμφανίζεται η δοκιμαστική μας αλυσίδα: το κεντρικό «Χρειάζεται έλεγχο», το υποκατάστημα στη Λάρνακα δείχνει το κεντρικό και το λογιστικό γραφείο «Δεν είναι στόχος προσέγγισης»."
        - "Μόνο αν δεν ταιριάζει τίποτα, πατήστε «Νέος οργανισμός»."

  - id: create
    shot: 'new organisation form: name, city, category; "Acquisition target (lead status Sourced)" stays ticked; email; source "Direct contact"; click "Create organisation"'
    chapter: { en: "Add an organisation" }
    window_path: { en: "localhost:3500/admin/crm/orgs/new" }
    callout: { en: "CRM · New organisation" }
    narration:
      en: >-
        Fill in the name, the city and the category.
        "Acquisition target" is ticked by default: keep it only if we want to win the organisation as a customer, and then give an email address or a phone number.
        Untick it for an organisation that is only the employer of a contact person.
        Choose the source and click "Create organisation".
        Contact persons are added later, on the organisation page.
    subtitle:
      el:
        - "Συμπληρώστε το όνομα, την πόλη και την κατηγορία."
        - "Το «Στόχος προσέγγισης» είναι επιλεγμένο από προεπιλογή: κρατήστε το μόνο αν θέλουμε να αποκτήσουμε τον οργανισμό ως πελάτη και τότε δώστε email ή αριθμό τηλεφώνου."
        - "Αφαιρέστε την επιλογή για οργανισμό που είναι μόνο ο εργοδότης ενός υπεύθυνου επικοινωνίας."
        - "Επιλέξτε την πηγή και πατήστε «Δημιουργία οργανισμού»."
        - "Οι υπεύθυνοι επικοινωνίας προστίθενται αργότερα, στη σελίδα του οργανισμού."

  - id: detail
    shot: 'page of "Team Demo Bakery": h1 + lead status badge, sections in order, "Head office and branches" with the branch'
    chapter: { en: "The organisation page" }
    window_path: { en: "localhost:3500/admin/crm/orgs/7413" }
    callout: { en: "CRM · Organisation" }
    narration:
      en: >-
        This is the page of one organisation: its name, and next to it the lead status.
        The sections always follow the same order, from the lead status down to outreach and the timeline.
        Team Demo Bakery is a head office and lists its branch.
        A chain has one level only, and nothing is inherited: each branch has its own channels, lead status and opt-out.
    subtitle:
      el:
        - "Αυτή είναι η σελίδα ενός οργανισμού: το όνομά του και δίπλα η κατάσταση lead."
        - "Οι ενότητες έχουν πάντα την ίδια σειρά, από την «Κατάσταση lead και ενέργειες» μέχρι την «Προσέγγιση» και το χρονολόγιο."
        - "Το Team Demo Bakery είναι κεντρικό και δείχνει το υποκατάστημά του («Κεντρικό και υποκαταστήματα»)."
        - "Μια αλυσίδα έχει μόνο ένα επίπεδο και τίποτα δεν κληρονομείται: κάθε υποκατάστημα έχει δικά του κανάλια, κατάσταση lead και opt-out."

  - id: lead
    shot: 'same page: badge "Needs review", click "Confirm business", confirm in the dialog -> badge "Queued"; pointer on "Set lead status"'
    chapter: { en: "Confirm business" }
    window_path: { en: "localhost:3500/admin/crm/orgs/7413" }
    callout: { en: "CRM · Lead status" }
    narration:
      en: >-
        The lead status is "Needs review": the organisation waits for a human decision, and no outreach is possible.
        We checked the details, so we click "Confirm business" and confirm.
        The organisation moves to "Queued" and can receive emails.
        "Set lead status" chooses another status, and a final status, such as "Hard opt-out", cannot be changed any more.
    subtitle:
      el:
        - "Η κατάσταση lead είναι «Χρειάζεται έλεγχο»: ο οργανισμός περιμένει ανθρώπινη απόφαση και δεν επιτρέπεται προσέγγιση."
        - "Ελέγξαμε τα στοιχεία, οπότε πατάμε «Επιβεβαίωση επιχείρησης» και επιβεβαιώνουμε."
        - "Ο οργανισμός περνά σε «Σε ουρά» και μπορεί να λαμβάνει email."
        - "Το «Ορισμός κατάστασης lead» επιλέγει άλλη κατάσταση και μια τελική κατάσταση, όπως το «Οριστικό opt-out», δεν αλλάζει πια."

  - id: channels
    shot: 'same page: "Channels of the organisation" table, then "Contact persons": Petros with "Channels of this relation" and personal channels marked "Personal"'
    chapter: { en: "Channels and their owner" }
    window_path: { en: "localhost:3500/admin/crm/orgs/7413" }
    callout: { en: "CRM · Channels" }
    narration:
      en: >-
        A channel belongs to exactly one owner, and a value is stored only once.
        Company channels, such as the info address and the official number, belong to the organisation, with type, value, legal tier, consent and reachability.
        Under "Contact persons", Petros has the company email of his relation to this bakery, and below it his personal channels.
        Video 5b explains people and relations.
    subtitle:
      el:
        - "Ένα κανάλι ανήκει σε ακριβώς έναν κάτοχο και μια τιμή αποθηκεύεται μόνο μία φορά."
        - "Τα εταιρικά κανάλια, όπως η διεύθυνση info και ο επίσημος αριθμός, ανήκουν στον οργανισμό («Κανάλια του οργανισμού»), με τύπο, τιμή, «Νομική βαθμίδα», συγκατάθεση και προσβασιμότητα."
        - "Στους «Υπεύθυνοι επικοινωνίας» ο Petros έχει το εταιρικό email της σχέσης του με αυτόν τον φούρνο και από κάτω τα «Προσωπικό» κανάλια του."
        - "Το βίντεο 5b εξηγεί τα πρόσωπα και τις σχέσεις."

  - id: outreach
    shot: 'same page, "Outreach": recipient select (default info address), choose Petros (relation, Red) -> warning box, "Send email" disabled; "Approve" -> dialog, reason, "Approve" -> approved box; English, "Load preview"; pointer on "Send email" (never clicked)'
    chapter: { en: "Outreach and the send gate" }
    window_path: { en: "localhost:3500/admin/crm/orgs/7413" }
    callout: { en: "CRM · Outreach" }
    narration:
      en: >-
        In "Outreach", pick the recipient: a channel of the organisation, or of a contact person with an active relation.
        The info address is the default.
        We choose the company email of Petros.
        Its legal tier is "Red", so a warning box appears and "Send email" stays disabled.
        An admin with the permission clicks "Approve", writes a reason of ten to five hundred characters, and confirms.
        One approval allows exactly one send to this recipient and expires after seven days.
        Then load the preview: "Send email" is active, but we do not send here.
    subtitle:
      el:
        - "Στην «Προσέγγιση» επιλέξτε τον «Παραλήπτη»: ένα κανάλι του οργανισμού ή ενός υπευθύνου επικοινωνίας με ενεργή σχέση."
        - "Η διεύθυνση info είναι η προεπιλογή."
        - "Επιλέγουμε το εταιρικό email του Petros."
        - "Η νομική βαθμίδα του είναι «Κόκκινη», οπότε εμφανίζεται πλαίσιο προειδοποίησης και η «Αποστολή email» μένει ανενεργή."
        - "Ένας διαχειριστής με το δικαίωμα πατά «Έγκριση», γράφει «Αιτιολόγηση (10 έως 500 χαρακτήρες)» και επιβεβαιώνει."
        - "Μία έγκριση επιτρέπει ακριβώς μία αποστολή σε αυτόν τον παραλήπτη και λήγει μετά από 7 ημέρες."
        - "Έπειτα φορτώστε την προεπισκόπηση: η «Αποστολή email» είναι ενεργή, αλλά εδώ δεν στέλνουμε."

  - id: optout
    shot: 'same page: "Suppress / Opt-out" -> dialog, pointer on the first reason, "Cancel"; then "Contact persons": Eleni with "Opted out"'
    chapter: { en: "Opt-out by owner" }
    window_path: { en: "localhost:3500/admin/crm/orgs/7413" }
    callout: { en: "CRM · Opt-out" }
    narration:
      en: >-
        An opt-out works by owner.
        "Suppress / Opt-out" here, or an unsubscribe through a channel of the organisation, blocks the organisation and all its channels.
        We cancel here.
        An unsubscribe through a channel of a person blocks only that person: Eleni shows "Opted out", and the bakery keeps its lead status.
        Exception: a person with the role "Owner" blocks the organisation as well.
    subtitle:
      el:
        - "Το opt-out λειτουργεί ανάλογα με τον κάτοχο."
        - "Το «Αποκλεισμός / Opt-out» εδώ ή μια διαγραφή μέσω καναλιού του οργανισμού μπλοκάρει τον οργανισμό και όλα τα κανάλια του («Οριστικό opt-out»)."
        - "Εδώ ακυρώνουμε."
        - "Μια διαγραφή μέσω καναλιού ενός προσώπου μπλοκάρει μόνο αυτό το πρόσωπο: η Eleni δείχνει «Έχει προβάλει αντίρρηση» και ο φούρνος κρατά την κατάσταση lead του."
        - "Εξαίρεση: ένα πρόσωπο με ρόλο «Ιδιοκτήτης/τρια» μπλοκάρει και τον οργανισμό."

  - id: review
    shot: 'review list (entries without "Team Demo" blurred): pointer over the category tabs, click "Relations without role" -> Nikos at the branch'
    chapter: { en: "Review list" }
    window_path: { en: "localhost:3500/admin/crm/review" }
    callout: { en: "CRM · Review list" }
    narration:
      en: >-
        The review list collects what a human has to check, in four categories, such as legacy cases and unclear channel owners.
        Here we open "Relations without role": the relation of Nikos to the branch has no role yet.
        It disappears by itself once fixed, and stored entries are closed with "Done" or "Dismiss".
        Entries of real people are blurred.
    subtitle:
      el:
        - "Η «Λίστα ελέγχου» συγκεντρώνει ό,τι πρέπει να ελέγξει ένας άνθρωπος, σε τέσσερις κατηγορίες, όπως «Παλαιές περιπτώσεις» και «Έλεγχος αντιστοίχισης καναλιών»."
        - "Εδώ ανοίγουμε τις «Σχέσεις χωρίς ρόλο»: η σχέση του Nikos με το υποκατάστημα δεν έχει ακόμη ρόλο."
        - "Εξαφανίζεται μόνη της μόλις διορθωθεί και οι αποθηκευμένες καταχωρίσεις κλείνουν με «Ολοκληρώθηκε» ή «Παράβλεψη»."
        - "Οι καταχωρίσεις πραγματικών ανθρώπων είναι θολές."

  - id: safety
    shot: 'CRM safety settings: pointer on kill switch, send limits, "Owner rule on objection", approval tiers (nothing changed or saved); sidebar Help'
    chapter: { en: "Safety settings" }
    window_path: { en: "localhost:3500/admin/crm/settings" }
    callout: { en: "CRM · Safety settings" }
    narration:
      en: >-
        Last, the safety settings: the kill switch pauses all sending, and below are the send limits per 24 hours.
        The owner rule on objection is on by default, and only the legal tier "Red" needs an approval before sending.
        These settings apply to everyone, so change them only after agreement with your team lead.
        The written guide is under Help in the sidebar, and video 5b follows.
        Thanks for watching.
    subtitle:
      el:
        - "Τέλος, οι «Ρυθμίσεις ασφαλείας»: ο διακόπτης (kill switch) σταματά κάθε αποστολή και παρακάτω είναι τα «Όρια αποστολής ανά 24 ώρες»."
        - "Ο «Κανόνας ιδιοκτήτη σε αντίρρηση» είναι ενεργός από προεπιλογή και μόνο η νομική βαθμίδα «Κόκκινη» χρειάζεται έγκριση πριν από την αποστολή."
        - "Αυτές οι ρυθμίσεις ισχύουν για όλους, γι' αυτό αλλάξτε τις μόνο μετά από συμφωνία με τον υπεύθυνο της ομάδας."
        - "Ο γραπτός οδηγός βρίσκεται στη «Βοήθεια» της πλευρικής στήλης και ακολουθεί το βίντεο 5b."
        - "Ευχαριστούμε που παρακολουθήσατε."

  - id: outro
    branding: outro
