# Team video 4 "Maintaining products" (F8960 T20, topic 4). Internal: channel "pundo Team", unlisted.
# EN voice (narration.en) + burnt-in EN subtitles; EL = subtitles only (subtitle.el -> out/team-products.el.srt).
# RE-CUT 2026-10-20 (decision BB): products ONLY. Categories and brands moved to video 3b (team-catalog-basics, topic catalog-basics) so that a change
# to categories/brands only touches the short video. MAINTAINABILITY (BB: "we must be able to cope with news"): the narration explains concepts and flow,
# names only stable UI words ("Add new", "Edit", "Save"), no field lists, no positions. The written SOP (src/lib/system-admin-help-content.ts, topic
# products) is the truth.
# Basis (code): product form (src/components/system-admin/ProductForm.tsx): name_<lang>/description_<lang> per language, at least one name (validate(),
# collect(): an emptied language goes out as '' = removed by the backend, the last name stays), slug required, barcode ean 8-14 digits (regex in validate()),
# brand and category = Combobox with debounced server-side search (6e9a1c1, B8200-004, Combobox loadItems), PATCH keeps the other languages (B8000-003).
# DRAFT (EN script awaits approval by Bernhard, EL awaits a native-speaker read: F8960 O3).
# Recording: ONLY test instance 3500/8500 (strict mode), admin login via API (no login scene), demo data from ../team-common/prepare_team.py
# (marker "Team Demo"; the ids in the address bars below must match the prepare_team.py output, record.mjs checks that). The video CREATES the product
# "Team Demo Rye Bread" (prepare_team.py deletes it on the next run) and edits the English name of "Team Demo Sourdough Loaf" (the upsert resets it).
# Deleting is never done. Real brands/categories are never readable: list rows AND dropdown entries without "Team Demo" are blurred by an init script.
# Address bar: every scene shows exactly one page (window_path is static per scene); page switches happen at the scene borders.

meta:
  slug: team-products
  format: desktop
  voice_langs: [en]
  subtitle_langs: [el]
  title:
    en: "Maintaining products"
    el: "Συντήρηση προϊόντων"
  url:
    en: "pundo team · admin help"
    el: "pundo team · βοήθεια admin"
  next_video:
    en: "Next: how translations come about"
    el: "Επόμενο: πώς δημιουργούνται οι μεταφράσεις"
  thumbnail_scene: create
  target_duration_s: 150
  window_path:
    en: "localhost:3500/admin/products"
    el: "localhost:3500/admin/products"

scenes:
  - id: intro
    branding: intro

  - id: find
    shot: 'list of products (non-demo rows blurred) -> search the demo barcode -> demo loaf with its barcode -> hover "Add new", click'
    chapter: { en: "Find products" }
    window_path: { en: "localhost:3500/admin/products" }
    callout: { en: "Admin · Products" }
    narration:
      en: >-
        Welcome back.
        This video covers products.
        Brand and category must exist beforehand, see video 3b.
        The platform holds thousands of products, so always search first.
        Search by name, brand or barcode.
        Here the barcode finds our demo loaf.
        If the product exists, edit it.
        Only when it is really missing, click "Add new".
    subtitle:
      el:
        - "Καλωσορίσατε ξανά."
        - "Αυτό το βίντεο αφορά τα προϊόντα."
        - "Η μάρκα και η κατηγορία πρέπει να υπάρχουν από πριν, δείτε το βίντεο 3b."
        - "Η πλατφόρμα έχει χιλιάδες προϊόντα, γι' αυτό αναζητάτε πάντα πρώτα."
        - "Αναζητήστε με όνομα, μάρκα ή barcode."
        - "Εδώ το barcode βρίσκει το demo ψωμί μας."
        - "Αν το προϊόν υπάρχει, επεξεργαστείτε το."
        - "Μόνο όταν πραγματικά λείπει, πατήστε «Προσθήκη νέου»."

  - id: create
    shot: 'new product form: name EN + DE, slug, barcode, brand and category via the search list (real entries blurred, "Team Demo" typed) -> hover "Save", click'
    chapter: { en: "Create a product" }
    window_path: { en: "localhost:3500/admin/products/new" }
    callout: { en: "Products · Add new" }
    narration:
      en: >-
        Every language has its own name and description.
        Fill in at least one name, in any language.
        Write it plainly, like the existing names: brand, product, size.
        The slug is a short URL-safe identifier that you type yourself.
        Enter the barcode if you have it, 8 to 14 digits.
        For brand and category, type part of the name and pick the entry from the list.
        The list searches the whole catalog, so a few letters are enough.
        Then click "Save".
    subtitle:
      el:
        - "Κάθε γλώσσα έχει δικό της όνομα και περιγραφή."
        - "Συμπληρώστε τουλάχιστον ένα όνομα, σε οποιαδήποτε γλώσσα."
        - "Γράψτε το απλά, όπως τα υπάρχοντα ονόματα: μάρκα, προϊόν, μέγεθος."
        - "Το slug είναι ένα σύντομο αναγνωριστικό κατάλληλο για URL, που πληκτρολογείτε μόνοι σας."
        - "Καταχωρίστε το barcode αν το έχετε, 8 έως 14 ψηφία."
        - "Για τη μάρκα και την κατηγορία, πληκτρολογήστε μέρος του ονόματος και επιλέξτε την καταχώριση από τη λίστα."
        - "Η λίστα ψάχνει σε ολόκληρο τον κατάλογο, οπότε αρκούν λίγα γράμματα."
        - "Έπειτα πατήστε «Αποθήκευση»."

  - id: saved
    shot: 'back in the list with the toast -> search "Team Demo" -> new product with barcode, brand and category -> pointer on the row, hover "Edit" of the sourdough loaf, click'
    chapter: { en: "Save and check" }
    window_path: { en: "localhost:3500/admin/products" }
    callout: { en: "Products · Save and check" }
    narration:
      en: >-
        After saving you are back in the list.
        Search for the product to check that it is stored correctly.
        Saving does not translate anything.
        The languages you left empty are added later by a separate translation run.
        If two records describe the same product, keep the better one and tell the team lead.
        Do not delete on your own.
        To change a product, click "Edit".
    subtitle:
      el:
        - "Μετά την αποθήκευση επιστρέφετε στη λίστα."
        - "Αναζητήστε το προϊόν για να ελέγξετε ότι αποθηκεύτηκε σωστά."
        - "Η αποθήκευση δεν μεταφράζει τίποτα."
        - "Οι γλώσσες που αφήσατε κενές προστίθενται αργότερα από μια ξεχωριστή εκτέλεση μετάφρασης."
        - "Αν δύο εγγραφές περιγράφουν το ίδιο προϊόν, κρατήστε την καλύτερη και ενημερώστε τον υπεύθυνο της ομάδας."
        - "Μη διαγράφετε μόνοι σας."
        - "Για να αλλάξετε ένα προϊόν, πατήστε «Επεξεργασία»."

  - id: edit
    shot: 'edit page of the demo sourdough loaf: all language versions, add a size to the English name, scroll through the other languages and to the attributes, back to "Save", click'
    chapter: { en: "Edit a product" }
    window_path: { en: "localhost:3500/admin/products/329578/edit" }
    callout: { en: "Products · Edit" }
    narration:
      en: >-
        The edit page shows every language version.
        Change only what is wrong or incomplete, for example a missing size in the English name.
        The other languages are kept as they are.
        If you empty a field, that language is removed, but the last name always stays.
        The category also asks for attributes.
        Add or correct them here.
        Then click "Save".
    subtitle:
      el:
        - "Η σελίδα επεξεργασίας δείχνει κάθε γλωσσική εκδοχή."
        - "Αλλάξτε μόνο ό,τι είναι λάθος ή ελλιπές, για παράδειγμα ένα μέγεθος που λείπει από το αγγλικό όνομα."
        - "Οι άλλες γλώσσες διατηρούνται ως έχουν."
        - "Αν αδειάσετε ένα πεδίο, η γλώσσα αυτή αφαιρείται, αλλά το τελευταίο όνομα μένει πάντα."
        - "Η κατηγορία ζητά και χαρακτηριστικά."
        - "Προσθέστε ή διορθώστε τα εδώ."
        - "Έπειτα πατήστε «Αποθήκευση»."

  - id: wrap
    shot: 'back in the list after Save (toast) -> search "Team Demo" -> both demo products; pointer on the loaf row'
    window_path: { en: "localhost:3500/admin/products" }
    callout: { en: "Products · Result" }
    narration:
      en: >-
        Back in the list, you see the saved product.
        Important: the other languages are not updated automatically.
        If the meaning of a text changes, tell the team lead.
        How translations come about is covered in video 4b.
        Thanks for watching.
    subtitle:
      el:
        - "Πίσω στη λίστα βλέπετε το αποθηκευμένο προϊόν."
        - "Σημαντικό: οι άλλες γλώσσες δεν ενημερώνονται αυτόματα."
        - "Αν αλλάξει το νόημα ενός κειμένου, ενημερώστε τον υπεύθυνο της ομάδας."
        - "Πώς δημιουργούνται οι μεταφράσεις, το εξηγεί το βίντεο 4b."
        - "Ευχαριστούμε που παρακολουθήσατε."

  - id: outro
    branding: outro
