# Team video 4b "How translations come about" (F8960 T21, topic 4b). Explainer, NOT a click-through SOP. Internal: channel "pundo Team", unlisted.
# EN voice (narration.en) + burnt-in EN subtitles; EL = subtitles only (subtitle.el -> out/team-translations.el.srt).
# REWRITTEN 2026-10-20: the old premise "your only lever is the source text" is gone. Since B8000-004 (commit 7c0e82c) every language version of a
# product can be edited in the product form; since B8000-003 (backend 4fc3f44) the PATCH merges names per language; the translation job only adds
# missing languages and never overwrites one (ingestor/lib/translation_handler.py:159-179). See PROD-NOTES.md for the evidence lines.
# DRAFT (EN script awaits approval by Bernhard, EL awaits a native-speaker read: F8960 O3).
# Picture: mix of real admin recordings (product edit page of the demo loaf, category translation table of the demo category) and local explainer
# graphics (graphics.html, shown in the browser-window frame; address bar says "pundo team · explainer"). No real data anywhere.
# Recording: ONLY test instance 3500/8500 (strict mode), admin login via API, demo data from ../team-common/prepare_team.py
# (ids in the address bars must match its output; record.mjs checks that).

meta:
  slug: team-translations
  format: desktop
  voice_langs: [en]
  subtitle_langs: [el]
  title:
    en: "How translations come about"
    el: "Πώς δημιουργούνται οι μεταφράσεις"
  url:
    en: "pundo team · admin help"
    el: "pundo team · βοήθεια admin"
  next_video:
    en: "Next: CRM, contacts and safety settings"
    el: "Επόμενο: CRM, επαφές και ρυθμίσεις ασφαλείας"
  thumbnail_scene: chain
  target_duration_s: 200
  window_path:
    en: "pundo team · explainer"
    el: "pundo team · επεξήγηση"

scenes:
  - id: intro
    branding: intro

  - id: chain
    shot: 'explainer graphic: source text -> translation run -> LLM gateway -> worker -> database, six language chips, note "Save does not start the run, only missing languages are added"'
    chapter: { en: "Where translations come from" }
    window_path: { en: "pundo team · explainer", el: "pundo team · επεξήγηση" }
    callout: { en: "Translations · Overview" }
    narration:
      en: >-
        Welcome back.
        This video is not a click-through.
        It explains where the translations of a product come from.
        You enter a product name in one or more languages.
        Later, a translation run takes the product.
        The team starts this run with the translation script, and it also starts by itself after a shop's catalog import.
        The run sends the product to the LLM gateway, a queue that hands the work to a language model.
        A worker runs the model, and the result is saved in the database.
        Only the languages that are still missing are added.
        Clicking "Save" in the product form does not start the run.
    subtitle:
      el:
        - "Καλωσορίσατε ξανά."
        - "Αυτό το βίντεο δεν είναι οδηγός με κλικ."
        - "Εξηγεί από πού προέρχονται οι μεταφράσεις ενός προϊόντος."
        - "Εισάγετε το όνομα ενός προϊόντος σε μία ή περισσότερες γλώσσες."
        - "Αργότερα, μια εκτέλεση μετάφρασης παίρνει το προϊόν."
        - "Την εκτέλεση αυτή την ξεκινά η ομάδα με το σενάριο μετάφρασης και ξεκινά και μόνη της μετά από εισαγωγή καταλόγου καταστήματος."
        - "Η εκτέλεση στέλνει το προϊόν στην πύλη LLM, μια ουρά που δίνει τη δουλειά σε ένα γλωσσικό μοντέλο."
        - "Ένας εκτελεστής τρέχει το μοντέλο και το αποτέλεσμα αποθηκεύεται στη βάση δεδομένων."
        - "Προστίθενται μόνο οι γλώσσες που λείπουν ακόμη."
        - "Το πάτημα του «Αποθήκευση» στη φόρμα προϊόντος δεν ξεκινά την εκτέλεση."

  - id: product
    shot: 'real admin: edit page of the demo loaf; pointer over the name fields of all languages (English, German, Arabic, Hebrew), then on Save (hover only, nothing saved)'
    chapter: { en: "Edit languages directly" }
    window_path: { en: "localhost:3500/admin/products/329578/edit" }
    callout: { en: "Products · Every language" }
    narration:
      en: >-
        Now look at a product in the admin.
        This is the edit page of our demo loaf.
        It has a name field and a description field for every language.
        You can write or correct any language version right here.
        Clear a field to remove that language.
        The last name always stays.
        Saving keeps the other languages.
    subtitle:
      el:
        - "Δείτε τώρα ένα προϊόν στο admin."
        - "Αυτή είναι η σελίδα επεξεργασίας του demo ψωμιού μας."
        - "Έχει ένα πεδίο ονόματος και ένα πεδίο περιγραφής για κάθε γλώσσα."
        - "Μπορείτε να γράψετε ή να διορθώσετε οποιαδήποτε γλωσσική εκδοχή ακριβώς εδώ."
        - "Αδειάστε ένα πεδίο για να αφαιρεθεί η γλώσσα αυτή."
        - "Το τελευταίο όνομα μένει πάντα."
        - "Η αποθήκευση διατηρεί τις άλλες γλώσσες."

  - id: merge
    shot: 'explainer graphic: before the run (EN + DE typed by you, four languages missing) -> after the run (EN/DE kept, four added by the job), note "never overwrites"'
    window_path: { en: "pundo team · explainer", el: "pundo team · επεξήγηση" }
    callout: { en: "Translations · What the run does" }
    narration:
      en: >-
        Here is what a translation run does with a product.
        You typed English and German.
        The run finds that Russian, Greek, Arabic and Hebrew are missing, and adds them.
        English and German stay exactly as you wrote them.
        The job never overwrites a language version that already exists.
        If a translation is wrong, correct that language in the product form, or tell the team lead.
    subtitle:
      el:
        - "Δείτε τι κάνει μια εκτέλεση μετάφρασης σε ένα προϊόν."
        - "Εσείς πληκτρολογήσατε αγγλικά και γερμανικά."
        - "Η εκτέλεση βρίσκει ότι λείπουν τα ρωσικά, τα ελληνικά, τα αραβικά και τα εβραϊκά, και τα προσθέτει."
        - "Τα αγγλικά και τα γερμανικά μένουν ακριβώς όπως τα γράψατε."
        - "Η εργασία δεν αντικαθιστά ποτέ μια γλωσσική εκδοχή που υπάρχει ήδη."
        - "Αν μια μετάφραση είναι λάθος, διορθώστε τη γλώσσα αυτή στη φόρμα προϊόντος ή ενημερώστε τον υπεύθυνο της ομάδας."

  - id: categories
    shot: 'real admin: category edit page of "Team Demo Category", translation table with six languages; type a German name, click Save (PUT translations)'
    chapter: { en: "Category names" }
    window_path: { en: "localhost:3500/admin/categories/53789/edit" }
    callout: { en: "Categories · Translations" }
    narration:
      en: >-
        Category names work in a similar way.
        Open a category and you see a table with all six languages.
        You can rename the category in any of them.
        Let us type a German name and click "Save".
        The name is stored directly, without a translation job.
        No automatic job overwrites it.
        Only a taxonomy seed that someone starts by hand with the overwrite option replaces existing category names.
        Whether production already has this safer behavior is still being checked, so never run a seed without asking.
    subtitle:
      el:
        - "Τα ονόματα κατηγοριών λειτουργούν με παρόμοιο τρόπο."
        - "Ανοίξτε μια κατηγορία και βλέπετε έναν πίνακα με και τις έξι γλώσσες."
        - "Μπορείτε να μετονομάσετε την κατηγορία σε οποιαδήποτε από αυτές."
        - "Ας πληκτρολογήσουμε ένα γερμανικό όνομα και ας πατήσουμε «Αποθήκευση»."
        - "Το όνομα αποθηκεύεται απευθείας, χωρίς εργασία μετάφρασης."
        - "Καμία αυτόματη εργασία δεν το αντικαθιστά."
        - "Μόνο μια εισαγωγή ταξινομίας που κάποιος ξεκινά με το χέρι με την επιλογή αντικατάστασης αντικαθιστά τα υπάρχοντα ονόματα κατηγοριών."
        - "Αν το production έχει ήδη αυτή την ασφαλέστερη συμπεριφορά, ελέγχεται ακόμη, γι' αυτό μην εκτελείτε ποτέ εισαγωγή χωρίς να ρωτήσετε."

  - id: marker
    shot: 'explainer graphic: three language versions look the same, but typed by you / language model / edited by hand; "nothing tells these apart"'
    chapter: { en: "No marker" }
    window_path: { en: "pundo team · explainer", el: "pundo team · επεξήγηση" }
    callout: { en: "Translations · Good to know" }
    narration:
      en: >-
        One last point.
        The data does not say which language version was written by the model and which by a person.
        Everything looks the same.
        Today the translation job never overwrites a language that already exists, so nothing is lost.
        But a later automatic re-translation could not tell careful manual work from machine text.
        That is only an idea for later, and it has low priority.
        That is all for translations.
        Next in this series: the CRM, with contacts, outreach and the safety settings.
        Thanks for watching.
    subtitle:
      el:
        - "Ένα τελευταίο σημείο."
        - "Τα δεδομένα δεν λένε ποια γλωσσική εκδοχή γράφτηκε από το μοντέλο και ποια από άνθρωπο."
        - "Όλα φαίνονται ίδια."
        - "Σήμερα η εργασία μετάφρασης δεν αντικαθιστά ποτέ μια γλώσσα που υπάρχει ήδη, άρα δεν χάνεται τίποτα."
        - "Μια μελλοντική αυτόματη νέα μετάφραση όμως δεν θα μπορούσε να ξεχωρίσει την προσεκτική χειροκίνητη δουλειά από το κείμενο του μηχανήματος."
        - "Είναι μόνο μια ιδέα για αργότερα και έχει χαμηλή προτεραιότητα."
        - "Αυτά ήταν όλα για τις μεταφράσεις."
        - "Στη συνέχεια της σειράς: το CRM, με επαφές, επικοινωνία και ρυθμίσεις ασφαλείας."
        - "Ευχαριστούμε που παρακολουθήσατε."

  - id: outro
    branding: outro
